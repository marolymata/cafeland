version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-quarkus-volumes
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: cafeland_db
      MYSQL_USER: quarkus_user
      MYSQL_PASSWORD: quarkus_password
    ports:
      - "3306:3306"
    volumes:
      # Named volume completamente administrado por Docker
      - mysql-data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - quarkus-network

volumes:
  # Docker decide dónde almacenar los datos
  mysql-data:

networks:
  quarkus-network:
    driver: bridge
