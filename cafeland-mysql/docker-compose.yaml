services:
  cafeland-db:
    image: mysql:8.0
    container_name: cafeland-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: cafeland_db
      MYSQL_USER: quarkus_user
      MYSQL_PASSWORD: quarkus_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "quarkus_user", "-pquarkus_password"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s  
      
  cafeland-api:
    image: marolymata/cafeland-api:1.1.0
    container_name: cafeland-app
    depends_on:
      cafeland-db:
        condition: service_healthy  
    environment:
      QUARKUS_DATASOURCE_USERNAME: quarkus_user
      QUARKUS_DATASOURCE_PASSWORD: quarkus_password
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:mysql://cafeland-db:3306/cafeland_db
    ports:
      - "8080:8080"

volumes:
  mysql_data:
